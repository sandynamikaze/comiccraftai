<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComicCraft AI</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <header>
    <div class="badge">AI COMIC GENERATOR</div>
    <h1>ComicCraft AI</h1>
    <p>Turn your story idea into a five-panel comic.</p>
  </header>

  <main class="card">
    <form id="comicForm">
      <label>Story Prompt</label>
      <textarea id="story_prompt" required>A young boy discovers a magical robot in a forest and they become friends.</textarea>

      <label>Character Name</label>
      <input id="character_name" value="Sabari" required>

      <label>Setting</label>
      <input id="setting" value="Magical forest">

      <label>Tone</label>
      <select id="tone">
        <option>Adventure</option>
        <option>Funny</option>
        <option>Fantasy</option>
        <option>Mystery</option>
        <option>Friendship</option>
        <option>Action</option>
      </select>

      <label>Art Style</label>
      <input id="art_style" value="colorful comic book style">

      <button id="generateBtn" type="submit">🚀 Generate Comic</button>
    </form>

    <div id="status"></div>
    <div id="result" class="hidden"></div>
  </main>
</div>

<script>
const form = document.getElementById("comicForm");
const button = document.getElementById("generateBtn");
const statusBox = document.getElementById("status");
const result = document.getElementById("result");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  button.disabled = true;
  button.textContent = "Generating...";
  statusBox.textContent = "Creating story and comic panels. This can take a little time.";
  result.classList.add("hidden");
  result.innerHTML = "";

  const payload = {
    story_prompt: document.getElementById("story_prompt").value,
    character_name: document.getElementById("character_name").value,
    setting: document.getElementById("setting").value,
    tone: document.getElementById("tone").value,
    art_style: document.getElementById("art_style").value
  };

  try {
    const response = await fetch("/generate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.detail || "Generation failed.");
    }

    result.innerHTML = `
      <h2>${escapeHtml(data.title)}</h2>
      <img class="comic" src="${data.comic_url}" alt="Generated comic">
      <div class="actions">
        <a href="${data.comic_url}" target="_blank">Open Comic</a>
        <a href="${data.pdf_url}" target="_blank">Download PDF</a>
      </div>
      <h3>Panels</h3>
      <div class="panels">
        ${data.images.map((url, i) => `<img src="${url}" alt="Panel ${i+1}">`).join("")}
      </div>
    `;
    result.classList.remove("hidden");
    statusBox.textContent = "Comic generated successfully!";
  } catch (error) {
    statusBox.textContent = "❌ " + error.message;
  } finally {
    button.disabled = false;
    button.textContent = "🚀 Generate Comic";
  }
});

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (m) => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[m]));
}
</script>
</body>
</html>
