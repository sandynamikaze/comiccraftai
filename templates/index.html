<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ComicCraft AI</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="container">

        <h1>🎨 ComicCraft AI</h1>

        <p>Create your own AI-powered comic!</p>

        <form action="/generate" method="post">

            <label>Story Prompt</label>
            <textarea
                name="story_prompt"
                placeholder="Enter your story idea..."
                required
            ></textarea>


            <label>Character Name</label>
            <input
                type="text"
                name="character_name"
                placeholder="Example: Arjun"
                required
            >


            <label>Setting</label>
            <input
                type="text"
                name="setting"
                placeholder="Example: Magical Forest"
                required
            >


            <label>Tone</label>
            <select name="tone" required>

                <option value="Funny">Funny</option>
                <option value="Adventure">Adventure</option>
                <option value="Emotional">Emotional</option>
                <option value="Mystery">Mystery</option>
                <option value="Action">Action</option>

            </select>


            <label>Art Style</label>
            <input
                type="text"
                name="art_style"
                placeholder="Example: Colorful comic book style"
                required
            >


            <button type="submit">
                🚀 Generate Comic
            </button>

        </form>

    </div>

</body>

</html>
